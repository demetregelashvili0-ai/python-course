<!-- 2. შექმენით პროდუქტის ბარათი, რომელშიც იქნება პროდუქტის სურათი, დასახელება, ფასი და ღილაკი. ბარათს მიანიჭეთ position:
  relative, ხოლო მის შიგნით შექმენით პატარა წარწერა „SALE“, რომელსაც ექნება position: absolute. top და right თვისებების გამოყენებით განათავსეთ წარწერა ბარათის ზედა მარჯვენა კუთხეში.
  დამატებით შექმენით მეორე წარწერა „NEW“ და bottom და left თვისებებით განათავსეთ ქვედა მარცხენა კუთხეში. ბარათს გაუკეთეთ ლამაზი დიზაინი, ჩრდილი და მომრგვალებული კუთხეები. -->
 
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პროდუქტის ბარათი</title>
    <link rel="stylesheet" href="cww.css">
</head>
<body>

    <div class="product-card">
        <h3 class="sale">SALE</h3>
        <h4 class="new">NEW</h4>

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
             alt="წითელი სპორტული ფეხსაცმელი">

        <div class="product-info">
            <h2>სპორტული ფეხსაცმელი</h2>
            <p class="price">149 ₾</p>
            <button>ყიდვა</button>
        </div>
    </div>

</body>
</html>
