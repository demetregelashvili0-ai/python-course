 right და bottom თვისებების გამოყენებით გადაადგილეთ Relative ბარათები სხვადასხვა მიმართულებით. დააკვირდით, რა განსხვავებაა Static და Relative პოზიციონირებას შორის. -->
 
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static და Relative</title>
    <link rel="stylesheet" href="cw1.css">
</head>

<body>

    <div class="card card1">
        <h2>ბარათი 1</h2>
        <p>ეს ბარათი იყენებს position: static.</p>
    </div>

    <div class="card card2">
        <h2>ბარათი 2</h2>
        <p>ეს ბარათიც იყენებს position: static.</p>
    </div>

    <div class="card card3">
        <h2>ბარათი 3</h2>
        <p>ეს ბარათი გადაადგილებულია ქვემოთ და მარჯვნივ.</p>
    </div>

    <div class="card card4">
        <h2>ბარათი 4</h2>
        <p>ეს ბარათი გადაადგილებულია ზემოთ და მარცხნივ.</p>
    </div>

</body>
</html>
