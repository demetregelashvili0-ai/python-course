<!-- 7. შექმენი რიცხვის შესაყვანი Input მაქსიმალური მნიშვნელობით

შექმენი HTML ფაილი და დაამატე <input>, სადაც მომხმარებელი შეიყვანს რიცხვს.

დავალება:

- გამოიყენე type="number".
- მიუთითე min="1".
- მიუთითე max="100".
- მომხმარებელმა უნდა შეიყვანოს რიცხვი 1-დან 100-მდე.
- ველი უნდა იყოს აუცილებლად შესავსები.
 -->

<!DOCTYPE html>
<html>
<head>
    <title>რიცხვის შეყვანა</title>
</head>
<body>

    <input type="number" min="1" max="100">

</body>
</html>
