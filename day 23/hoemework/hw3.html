<!-- 3. აირჩიე კვირის დღე

შექმენი <select> თეგი, სადაც მომხმარებელს შეეძლება კვირის დღის არჩევა.

დაამატე შემდეგი option-ები:

- Monday
- Tuesday
- Wednesday
- Thursday
- Friday
- Saturday
- Sunday

ჩამოსაშლელ მენიუში პირველ ვარიანტად დაამატე:

Choose a day

ეს ვარიანტი უნდა იყოს disabled. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select>
  <option disabled selected>Choose a day</option>
  <option>Monday</option>
  <option>Tuesday</option>
  <option>Wednesday</option>
  <option>Thursday</option>
  <option>Friday</option>
  <option>Saturday</option>
  <option>Sunday</option>
</select>
    
</body>
</html>
