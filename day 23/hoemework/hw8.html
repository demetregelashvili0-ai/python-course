<!-- 8. შექმენი ასაკის შესაყვანი Input

შექმენი HTML ფაილი და დაამატე <input>, სადაც მომხმარებელი შეიყვანს საკუთარ ასაკს.

დავალება:

- გამოიყენე type="number".
- მიუთითე მინიმალური ასაკი 18.
- მიუთითე მაქსიმალური ასაკი 100.
- გამოიყენე required.
- დაამატე label ტექსტით: Enter your age. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for=" Enter your age"> Enter your age</label>
    <input type="number" id=" Enter your age" name=" Enter your age." min="18" max="100" required>
    
</body>
</html>
