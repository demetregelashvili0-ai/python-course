<!--2) შექმენი „ჩემი საყვარელი ნივთების“ გვერდი.
გამოიყენე <h1>, <h2>, <img>, <ul>, <li> და <a>.
დაამატე მინიმუმ 3 სურათი, თითოეულს მიუთითე alt და width.
ასევე დაამატე მინიმუმ 2 ბმული.
  -->
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ჩემი საყვარელი ნივთები</title>
</head>
<body>

    <h1>ჩემი საყვარელი ნივთები</h1>

    <h2>ჩემი ნივთების სია</h2>

    <ul>
        <li>კომპიუტერი</li>
        <li>ტელეფონი</li>
        <li>ყურსასმენები</li>
    </ul>

    <h2>ჩემი საყვარელი ნივთები</h2>

    <img src="computer.jpg" alt="ჩემი კომპიუტერი" width="300">
    <img src="phone.jpg" alt="ჩემი ტელეფონი" width="300">
    <img src="headphones.jpg" alt="ჩემი ყურსასმენები" width="300">

    <h2>სასარგებლო ბმულები</h2>

    <a href="https://www.google.com">Google</a>
    <br>
    <a href="https://www.youtube.com">YouTube</a>

</body>
</html>
