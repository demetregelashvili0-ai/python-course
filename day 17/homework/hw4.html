<!--4) შექმენი პატარა „ონლაინ მენიუ“.
მოიფიქრე კაფე და ჩამოწერე მინიმუმ 6 კერძი <ul>-ის გამოყენებით. დაამატე კაფის ერთი ფოტო და მისი სახელი <h1>-ით.
-->
    <!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ონლაინ მენიუ</title>
</head>
<body>

    <h1>Sweet cafe</h1>

    <img src="cafe.jpg" alt="Sweet Café" width="500">

    <h2>მენიუ</h2>

    <ul>
        <li> პიცა — 12 ლარი</li>
        <li> ჩიზბურგერი — 10 ლარი</li>
        <li> სპაგეტი — 11 ლარი</li>
        <li> ცეზარის სალათი — 9 ლარი</li>
        <li> ჩიზქეიქი — 7 ლარი</li>
        <li> კაპუჩინო — 5 ლარი</li>
    </ul>

</body>
</html>
