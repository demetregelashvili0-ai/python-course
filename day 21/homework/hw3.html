<!-- 3. ასაკის ფორმა

შექმენი <form>, რომელშიც იქნება:

label — Age
input — ასაკის შესაყვანად
button — Submit

გამოიყენე შესაბამისი input type. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="Age">Age:</label>
        <input type="text" id="Age" name="Age">
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
